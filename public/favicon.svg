<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .glyph { fill: #0f172a }
    /* The tab strip inverts in dark mode; so does the mark. */
    @media (prefers-color-scheme: dark) { .glyph { fill: #f8fafc } }
  </style>
