<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG is the one that adapts to the tab strip's theme, so modern
         browsers take it; the .ico is the fallback for search results and
         older clients, and carries the tile version of the same mark. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal site, project portfolio, and wishlist." />
    <title>Maksym Popenko</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;460;500;600&family=Newsreader:ital,opsz,wght@1,6..72,300..600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Old links used hash-based routing (e.g. /#/wishlist). Rewrite them to
      // real paths before React Router reads the URL, so they keep working.
      if (window.location.hash.startsWith('#/')) {
        var target = window.location.hash.slice(1)
        window.history.replaceState(null, '', target + window.location.search)
      }
    </script>
    <script>
      // An explicit light/dark choice wins; 'system' and a missing key both
      // mean "follow the OS". Runs before React mounts, so there's no flash of
      // the wrong theme on first paint.
      var storedTheme = null
      try {
        storedTheme = localStorage.theme
      } catch (error) {
        // Storage blocked (Safari private mode) — fall through to the OS.
      }
      if (
        storedTheme === 'dark' ||
        (storedTheme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark')
      }
      // Default to Ukrainian; keep <html lang> in sync before React mounts.
      var storedLang = localStorage.lang
      document.documentElement.lang = storedLang === 'en' ? 'en' : 'uk'
    </script>
    <script type="module" crossorigin src="/assets/index-FYZwOreC.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Cfcyq0rJ.css">
  </head>
  <body class="bg-white dark:bg-slate-900">
    <div id="root"></div>
  </body>
</html>
